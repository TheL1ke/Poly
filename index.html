<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Polly</title>
<style>
body {
background: #000;
margin: 0;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
}
.heart {
position: relative;
width: 300px;
height: 300px;
}
.heart span {
position: absolute;
top: 50%;
left: 50%;
color: #ea80b0;
font-size: 14px;
text-shadow: 0 0 10px #fff;
white-space: nowrap;
font-family: Arial, sans-serif;
animation: beat 2s infinite alternate ease-in-out;
}
@keyframes beat {
from { transform: translate(-50%, -50%) scale(1); }
to { transform: translate(-50%, -50%) scale(1.05); }
}
.text {
position: absolute;
bottom: 80px;
width: 100%;
text-align: center;
color: #ea80b0;
font-size: 40px;
font-weight: bold;
text-shadow: 0 0 15px #ea80b0, 0 0 30px #ea80b0;
font-family: Arial, sans-serif;
}
</style>
</head>
<body>

<div class="heart" id="heart"></div>
<div class="text">4 Polly</div>

<script>
var heart = document.getElementById('heart');
var total = 60;
for (var i = 0; i < total; i++) {
var angle = (i / total) * 360;
var rad = angle * Math.PI / 180;
var x = 16 * Math.pow(Math.sin(rad), 3);
var y = -(13 * Math.cos(rad) - 5 * Math.cos(2*rad) - 2 * Math.cos(3*rad) - Math.cos(4*rad));
var span = document.createElement('span');
span.innerText = 'I love you';
span.style.left = (150 + x * 7) + 'px';
span.style.top = (150 + y * 7) + 'px';
span.style.transform = 'translate(-50%, -50%) rotate(' + (angle + 90) + 'deg)';
span.style.animationDelay = (i * 0.05) + 's';
heart.appendChild(span);
}
</script>

</body>
</html>
